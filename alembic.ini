# alembic.ini — Alembic database migration configuration for Gaitway
#
# Usage:
#   alembic upgrade head               — apply all pending migrations
#   alembic downgrade -1               — roll back one migration
#   alembic revision --autogenerate \
#     -m "description"                 — generate a new migration
#   alembic current                    — show current revision
#   alembic history --verbose          — show full migration history

[alembic]
script_location = alembic
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 40

# Prepend project root to sys.path so "from src.db.models import Base" works
prepend_sys_path = .

[post_write_hooks]
# Uncomment to auto-format new migration files with black:
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100 REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
