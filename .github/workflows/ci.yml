name: CI Pipeline — Shoe Print Image System

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install moto[s3]

      - name: Run linter (ruff)
        run: ruff check src/ tests/

      - name: Check code formatting (black)
        run: black --check src/ tests/

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing
        env:
          AWS_ACCESS_KEY_ID: test-key
          AWS_SECRET_ACCESS_KEY: test-secret
          AWS_DEFAULT_REGION: us-east-1
          S3_BUCKET_NAME: test-shoeprint-bucket

  deploy-check:
    name: Deployment Readiness Check
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify no secrets in code
        run: |
          echo "Scanning for potential secrets..."
          if grep -r "AKIA" src/ tests/ --include="*.py"; then
            echo "❌ Possible AWS Access Key found in source code!"
            exit 1
          fi
          echo "✅ No hardcoded secrets detected"

      - name: Confirm deployment readiness
        run: |
          echo "✅ All tests passed — code is ready for AWS deployment"
          echo "ℹ️  Manual deployment step required (AWS infrastructure not yet automated)"
