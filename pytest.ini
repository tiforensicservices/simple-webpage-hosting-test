[pytest]
# Suppress third-party C extension warning that cannot be fixed externally.
# lxml's HTMLParser (inside bs4) emits "The 'strip_cdata' option has never
# done anything" from a compiled C extension — not our code.
# Our own deprecations (Pydantic V2, FastAPI lifespan, datetime.UTC) are
# already fixed in the source; this just keeps the test output clean.
filterwarnings =
    ignore:The 'strip_cdata' option of HTMLParser:DeprecationWarning
